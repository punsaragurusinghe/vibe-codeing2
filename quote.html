<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Quote | Guruලී</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .quote-section {
            padding: 120px 0 80px;
            background-color: var(--cream-bg);
            min-height: 100vh;
        }
        .quote-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--white);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }
        @media screen and (max-width: 480px) {
            .quote-container {
                padding: 20px;
                border-radius: 0;
            }
            .quote-section {
                padding: 100px 0 40px;
            }
        }
        .quote-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .quote-header h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-brown);
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .product-summary {
            background: #f9f4f0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 30px;
            border-left: 5px solid var(--oak-brown);
        }
        .product-summary p {
            margin: 5px 0;
            font-weight: 600;
            color: var(--text-dark);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-brown);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
        }
        .form-group textarea {
            height: 120px;
            resize: vertical;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--oak-brown);
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-brown);
            color: var(--white);
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: var(--oak-brown);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--oak-brown);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header id="main-header" style="background: rgba(75, 44, 32, 1);">
        <nav class="container">
            <div class="logo">Guru<span>ලී</span></div>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#products">Products</a></li>
                <li><a href="index.html#gallery">Gallery</a></li>
                <li><a href="index.html#contact">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <section class="quote-section">
        <div class="container">
            <div class="quote-container">
                <div class="quote-header">
                    <h2>Request a Quote</h2>
                    <p>Tell us more about your interest and we'll get back to you with the best price.</p>
                </div>

                <div class="product-summary">
                    <p>Product: <span id="display-product-name">Selected Item</span></p>
                    <p>Price: <span id="display-product-price">Rs. 0.00</span></p>
                </div>

                <form id="quote-form">
                    <input type="hidden" id="product_name" name="product_name">
                    <input type="hidden" id="product_price" name="product_price">
                    
                    <div class="form-group">
                        <label for="customer_name">Customer Name</label>
                        <input type="text" id="customer_name" name="customer_name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="phone_number">Phone Number</label>
                        <input type="tel" id="phone_number" name="phone_number" placeholder="Enter your phone number" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message (Optional)</label>
                        <textarea id="message" name="message" placeholder="Any specific requirements or questions?"></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Submit Quote Request</button>
                </form>

                <a href="index.html#products" class="back-link"><i class="fas fa-arrow-left"></i> Back to Products</a>
            </div>
        </div>
    </section>

    <footer id="contact">
        <div class="footer-bottom">
            <p>&copy; 2026 Guruලී Wood Architecture. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const productName = urlParams.get('product');
        const productPrice = urlParams.get('price');

        // Populate fields
        if (productName) {
            document.getElementById('display-product-name').textContent = productName;
            document.getElementById('product_name').value = productName;
        }
        if (productPrice) {
            document.getElementById('display-product-price').textContent = productPrice;
            document.getElementById('product_price').value = productPrice;
        }

        // Form submission
        document.getElementById('quote-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for your inquiry! We will contact you soon.');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
